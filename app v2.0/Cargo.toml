[package]
name = "afandi_launcher"
version = "1.1.0"
edition = "2021"

[dependencies]
# Added features to solve winuser/windef errors
eframe = { version = "0.22", features = ["default"] }
rfd = "0.11"
walkdir = "2.3"
reqwest = { version = "0.11", features = ["blocking"] }
# Explicitly enabling required windows features
winapi = { version = "0.3", features = ["winuser", "windef", "winbase"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true